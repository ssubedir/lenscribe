<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/lenscribe-logo-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lenscribe</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("lenscribe-theme") === "dark" ? "dark" : "light";
      } catch {
        /* Use the default light theme when storage is unavailable. */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
