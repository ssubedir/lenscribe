name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend and formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-frontend
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check generated types and frontend
        run: bun run check
      - name: Check formatting
        run: bun run format:check
      - name: Check documentation formatting
        run: bunx prettier --check "*.md" docs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Test frontend and release scripts
        run: bun run test
      - name: Build frontend
        run: bun run build

  native:
    name: Native / ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
          - name: Linux x64
            runner: ubuntu-22.04
          - name: macOS Apple Silicon
            runner: macos-latest
          - name: macOS Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ci-${{ matrix.runner }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build native app
        run: bun run tauri build --ci --debug --no-bundle -- --locked
